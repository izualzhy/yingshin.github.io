<script>
    // 加载Waline脚本 - 使用可靠的CDN源
    (function() {
        // 尝试多个CDN源
        const cdnSources = [
            'https://cdn.jsdelivr.net/npm/@waline/client@v2/dist/waline.js',
            'https://unpkg.com/@waline/client@v2/dist/waline.js',
            'https://cdn.staticfile.net/waline/2.15.8/waline.js'
        ];

        function loadScript(src, index) {
            console.log('尝试加载Waline脚本:', src);
            var script = document.createElement('script');
            script.src = src;

            script.onload = function() {
                console.log('Waline脚本加载成功，来源:', src);
                window.dispatchEvent(new Event('waline:loaded'));
            };

            script.onerror = function() {
                console.error('Waline脚本加载失败，来源:', src);
                // 尝试下一个源
                if (index + 1 < cdnSources.length) {
                    loadScript(cdnSources[index + 1], index + 1);
                } else {
                    console.error('所有CDN源都失败了');
                    // 显示错误信息
                    const walineEl = document.getElementById('waline');
                    if (walineEl) {
                        walineEl.innerHTML = '<div style="color: #999; padding: 20px; text-align: center; font-size: 14px;">评论功能暂时不可用</div>';
                    }
                }
            };

            document.head.appendChild(script);
        }

        // 开始加载第一个源
        loadScript(cdnSources[0], 0);
    })();
</script>
<link href='https://cdn.jsdelivr.net/npm/@waline/client@v2/dist/waline.css' rel='stylesheet' />

<div id="waline"></div>
<script>
    // 等待DOM完全加载后再初始化Waline
    function initWaline() {
        // 检查元素是否存在
        const walineEl = document.getElementById('waline');
        if (!walineEl) {
            console.error('Waline容器元素未找到');
            return;
        }

        // 检查Waline是否可用
        if (typeof Waline === 'undefined') {
            console.error('Waline未定义，脚本可能加载失败');
            return;
        }

        try {
            console.log('正在初始化Waline...');

            // 配置Waline，添加错误处理和超时设置
            const config = {
                el: '#waline',
                serverURL: 'https://waline-comment-izualzhy.vercel.app/',
                path: window.location.pathname,
                lang: 'zh-CN',
                // 核心功能配置
                dark: false,
                search: false,
                imageUploader: false,
                highlighter: false,
                texRenderer: false,
                login: 'disable',
                copyright: false,
                emoji: false,
                preview: false,
                requiredMeta: ['nick', 'mail'],
                avatar: 'retro',
                avatarForce: false,
                // 网络请求配置
                timeout: 10000, // 10秒超时
                // 错误处理
                errorHandler: (error) => {
                    console.warn('Waline请求错误:', error);
                    // 在评论区域显示友好错误信息
                    const walineEl = document.getElementById('waline');
                    if (walineEl) {
                        const errorMsg = document.createElement('div');
                        errorMsg.style.cssText = 'color: #666; padding: 20px; text-align: center; font-size: 14px;';
                        errorMsg.innerHTML = '评论加载失败，可能是网络问题。请检查网络连接或稍后重试。';

                        const cards = walineEl.querySelector('.wl-cards');
                        if (cards && cards.children.length === 0) {
                            cards.appendChild(errorMsg);
                        }
                    }
                },
                // 成功回调
                successHandler: () => {
                    console.log('Waline请求成功');
                }
            };

            console.log('Waline配置:', config);

            let instance;
            try {
                instance = Waline.init(config);
                if (instance) {
                    window.walineInstance = instance;
                    console.log('Waline实例创建成功');
                }
            } catch (error) {
                console.error('Waline初始化异常:', error);
                // 显示错误信息
                const walineEl = document.getElementById('waline');
                if (walineEl) {
                    walineEl.innerHTML = '<div style="color: #999; padding: 20px; text-align: center; font-size: 14px;">评论功能初始化失败，请刷新页面重试</div>';
                }
            }

            if (instance) {
                console.log('Waline初始化成功');
                // 存储实例以便调试
                window.walineInstance = instance;
            } else {
                console.error('Waline初始化返回空实例');
            }
        } catch (error) {
            console.error('Waline初始化失败:', error);
            // 显示错误信息给用户
            walineEl.innerHTML = '<div style="color: #666; padding: 20px; text-align: center;">评论加载失败，请刷新页面重试</div>';
        }
    }

    // 主初始化函数
    function mainInit() {
        // 等待Waline脚本和DOM都准备好
        function checkAndInit() {
            if (typeof Waline !== 'undefined' && document.readyState !== 'loading') {
                initWaline();
                return true;
            }
            return false;
        }

        // 立即检查
        if (!checkAndInit()) {
            // 监听Waline加载事件
            window.addEventListener('waline:loaded', function() {
                if (document.readyState !== 'loading') {
                    initWaline();
                } else {
                    document.addEventListener('DOMContentLoaded', initWaline);
                }
            });

            // 如果Waline已经加载但DOM未就绪
            if (typeof Waline !== 'undefined') {
                document.addEventListener('DOMContentLoaded', initWaline);
            }
        }
    }

    // 开始初始化流程
    mainInit();
</script>
