<link rel="preload" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" as="style">
<link rel="preload" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" as="script">
<link rel="preload" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" as="script">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
	.katex-loading::before {
		content: "📐 公式加载中...";
		color: #999;
		font-size: 0.9em;
		font-style: italic;
	}
	.katex-loading > * {
		visibility: hidden;
	}
</style>
<script>
	document.addEventListener("DOMContentLoaded", function() {
		// 匹配 $$...$$、\(...\)、\[...\]、$...$ 的公式
		var mathRe = /(\$\$[\s\S]+?\$\$)|(\$[^$\n]+\$)|(\\\[[\s\S]+?\\\])|(\\\([\s\S]+?\\\))/;

		// 仅给「本身不包含子元素」的小元素加 loading，
		// 避免整段文章摘要被正则误伤而隐藏。
		var mathElements = document.querySelectorAll('p, div, span, td, li');
		mathElements.forEach(function(el) {
			if (el.children.length === 0 && mathRe.test(el.textContent)) {
				el.classList.add('katex-loading');
			}
		});

		// 渲染数学公式；无论成败都要移除 loading，绝不残留占位文案
		try {
			if (typeof renderMathInElement === 'function') {
				renderMathInElement(document.body, {
					delimiters: [
						{left: "$$", right: "$$", display: true},
						{left: "\\[", right: "\\]", display: true},
						{left: "\\(", right: "\\)", display: false},
						{left: "$", right: "$", display: false}
					],
					throwOnError: false
				});
			} else {
				throw new Error('KaTeX auto-render 未加载');
			}
		} catch (e) {
			console.warn('KaTeX 渲染失败，已跳过占位隐藏:', e);
		} finally {
			document.querySelectorAll('.katex-loading').forEach(function(el) {
				el.classList.remove('katex-loading');
			});
		}
	});
</script>
